<div class="layout-container" aria-label="Layout Container">
  <mat-toolbar color="primary" class="toolbar" aria-label="Toolbar">
    <div class="left-section">
      <img src="https://img.logo.dev/worldbank.org?token=pk_J1Y3" alt="Logo" class="logo" aria-label="AquaLife Logo">
      <span aria-label="Platform Title">{{ 'toolbar.title' | translate }}</span>
    </div>
    <div class="right-section">
      <mat-select [(value)]="currentLang" (selectionChange)="switchLanguage($event.value)" class="lang-select" aria-label="Language Selector">
        <mat-option value="en">EN</mat-option>
        <mat-option value="es">ES</mat-option>
      </mat-select>
    </div>
  </mat-toolbar>
  <mat-sidenav-container class="sidenav-container" aria-label="Sidebar Container">
    <mat-sidenav mode="side" opened class="sidenav" aria-label="Main Navigation">
      <mat-nav-list>
        <a mat-list-item routerLink="/home" aria-label="Home Link">{{ 'toolbar.home' | translate }}</a>
        <a mat-list-item routerLink="/reservations/new" aria-label="New Reservation Link">{{ 'toolbar.new-reservation' | translate }}</a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content class="content-shell" aria-label="Main Content Area">
      <main class="page-content">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
